name: Deploy
on:
  push:
    branches: [main]
env:
  APP_NAME: wechat-top-article
  APP_PORT: "8003"
  REGISTRY_URL: crpi-2hhvyuuzflfxsyey.cn-beijing.personal.cr.aliyuncs.com
  REGISTRY_NAMESPACE: chmjk67
  ECS_IP: 39.105.86.184
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:latest
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:${{ github.sha }}
      - name: Setup Caddy WeChat proxy on ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.ECS_IP }}
          username: root
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            # 安装 Caddy（如已安装则跳过）
            if ! command -v caddy &>/dev/null; then
              apt-get update -qq
              apt-get install -y -qq debian-keyring debian-archive-keyring apt-transport-https
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
              apt-get update -qq && apt-get install -y -qq caddy
            fi

            # 追加微信 API 代理到 Caddyfile（如果还没有的话）
            if ! grep -q '/wechat-api' /etc/caddy/Caddyfile 2>/dev/null; then
              cat >> /etc/caddy/Caddyfile << 'CADDYEOF'

    # ---------- 微信公众号 API 代理 ----------
    chmjk67.top {
        route /wechat-api/* {
            uri strip_prefix /wechat-api
            reverse_proxy https://api.weixin.qq.com {
                header_up Host api.weixin.qq.com
            }
        }
    }
CADDYEOF
              echo "✅ Caddy WeChat proxy route added"
            else
              echo "✅ Caddy WeChat proxy route already exists"
            fi

            systemctl enable caddy 2>/dev/null
            systemctl reload caddy 2>&1
            echo "✅ Caddy configured and reloaded"

            # 验证
            echo "--- Verifying WeChat proxy ---"
            curl -s "http://localhost/wechat-api/cgi-bin/token?grant_type=client_credential&appid=wxb06b265a34dda1a4&secret=b9d5a602da99766b6cda972f0ab13cef" | head -c 200
            echo ""
            echo "✅ Caddy setup complete"

      - name: Deploy app to ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.ECS_IP }}
          username: root
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            docker login ${{ env.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}
            docker pull ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:latest
            docker stop ${{ env.APP_NAME }} 2>/dev/null || true
            docker rm ${{ env.APP_NAME }} 2>/dev/null || true
            docker run -d \
              --name ${{ env.APP_NAME }} \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:80 \
              -e WECHAT_APPID=${{ secrets.WECHAT_APPID }} \
              -e WECHAT_APPSECRET=${{ secrets.WECHAT_APPSECRET }} \
              -e WECHAT_PROXY_KEY=${{ secrets.WECHAT_PROXY_KEY }} \
              -v /data/wechat-top-article:/data \
              ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:latest
            docker image prune -f
            echo "✅ Deployed ${{ env.APP_NAME }} on port ${{ env.APP_PORT }}"
