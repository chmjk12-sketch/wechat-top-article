name: Deploy
on:
  push:
    branches: [main]
env:
  APP_NAME: wechat-top-article
  APP_PORT: "8003"
  REGISTRY_URL: crpi-2hhvyuuzflfxsyey.cn-beijing.personal.cr.aliyuncs.com
  REGISTRY_NAMESPACE: chmjk67
  ECS_IP: 39.105.86.184
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:latest
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:${{ github.sha }}
      - name: Deploy to ECS
        run: |
          curl -s -X POST "https://webhook.placeholder/trigger-deploy" || true
          echo "Image pushed: $REGISTRY_URL/$REGISTRY_NAMESPACE/$APP_NAME:latest"
          echo "Run deploy script on ECS to update container"
