name: Deploy
on:
  push:
    branches: [main]
env:
  APP_NAME: wechat-top-article
  APP_PORT: "8003"
  REGISTRY_URL: crpi-2hhvyuuzflfxsyey.cn-beijing.personal.cr.aliyuncs.com
  REGISTRY_NAMESPACE: chmjk67
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:latest
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:${{ github.sha }}
      - name: Deploy to ECS via SSH
        id: ssh-deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          script: |
            /opt/app/scripts/deploy.sh --app-name ${{ env.APP_NAME }} --image ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:${{ github.sha }} --port ${{ env.APP_PORT }} --internal-port 80 --health-path /api/v1/health
      - name: Deploy via RunCommand API (fallback)
        if: steps.ssh-deploy.outcome == 'failure'
        run: |
          python3 -c "
          import json,hmac,hashlib,base64,urllib.request,urllib.parse,uuid,time
          from datetime import datetime,timezone
          AK='\${{ secrets.ALIYUN_ACCESS_KEY_ID }}';SK='\${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}'
          def sgn(p):
            sp=sorted(p.items());Q=urllib.parse.quote
            q='&'.join(Q(k,'')+'='+Q(v,'') for k,v in sp)
            s='GET&'+Q('/','')+'&'+Q(q,'')
            return q+'&Signature='+Q(base64.b64encode(hmac.new((SK+'&').encode(),s.encode(),hashlib.sha1).digest()).decode(),'')
          def rc(i,c,t=120):
            b=base64.b64encode(c.encode()).decode()
            p={'Action':'RunCommand','RegionId':'cn-beijing','InstanceId.1':i,'Type':'RunShellScript','CommandContent':b,'ContentEncoding':'Base64','Timeout':str(t),'Format':'JSON','Version':'2014-05-26','AccessKeyId':AK,'SignatureMethod':'HMAC-SHA1','SignatureVersion':'1.0','Timestamp':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'SignatureNonce':str(uuid.uuid4())}
            iid=json.loads(urllib.request.urlopen('https://ecs.aliyuncs.com/?'+sgn(p),timeout=10).read())['InvokeId']
            for _ in range(t//3):
              time.sleep(3)
              p2={**p,'Action':'DescribeInvocationResults','InvokeId':iid}
              d=json.loads(urllib.request.urlopen('https://ecs.aliyuncs.com/?'+sgn(p2),timeout=10).read())
              for r in d.get('Invocation',{}).get('InvocationResults',{}).get('InvocationResult',[]):
                if r.get('InvocationStatus') in ('Success','Failed','Finished'):
                  o=r.get('Output','')or''
                  print(base64.b64decode(o).decode('utf-8','replace')if o else r['InvocationStatus']);return
          rc('i-2zeee6djmc1qhwptmz1l','''docker login --username=\${{ secrets.REGISTRY_USERNAME }} --password=\${{ secrets.REGISTRY_PASSWORD }} \${{ env.REGISTRY_URL }}
docker pull \${{ env.REGISTRY_URL }}/\${{ env.REGISTRY_NAMESPACE }}/\${{ env.APP_NAME }}:latest
docker stop \${{ env.APP_NAME }}_app 2>/dev/null;docker rm \${{ env.APP_NAME }}_app 2>/dev/null
docker run -d --name \${{ env.APP_NAME }}_app -p \${{ env.APP_PORT }}:80 --restart always --network caddy-net \${{ env.REGISTRY_URL }}/\${{ env.REGISTRY_NAMESPACE }}/\${{ env.APP_NAME }}:latest
sleep 5;curl -sf http://127.0.0.1:\${{ env.APP_PORT }}/api/v1/health&&echo HEALTH_OK||echo HEALTH_FAIL''')"
          echo "Deployed via RunCommand"
