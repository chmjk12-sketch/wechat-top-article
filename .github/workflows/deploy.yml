name: Deploy
on:
  push:
    branches: [main]
env:
  APP_NAME: wechat-top-article
  APP_PORT: "8003"
  REGISTRY_URL: crpi-2hhvyuuzflfxsyey.cn-beijing.personal.cr.aliyuncs.com
  REGISTRY_NAMESPACE: chmjk67
  ECS_IP: 39.105.86.184
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:latest
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:${{ github.sha }}
      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.ECS_IP }}
          username: root
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            docker login ${{ env.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }}
            docker pull ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:latest
            docker stop ${{ env.APP_NAME }} 2>/dev/null || true
            docker rm ${{ env.APP_NAME }} 2>/dev/null || true
            docker run -d \
              --name ${{ env.APP_NAME }} \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:80 \
              -e WECHAT_APPID=${{ secrets.WECHAT_APPID }} \
              -e WECHAT_APPSECRET=${{ secrets.WECHAT_APPSECRET }} \
              -e WECHAT_PROXY_KEY=${{ secrets.WECHAT_PROXY_KEY }} \
              -v /data/wechat-top-article:/data \
              ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_NAME }}:latest
            docker image prune -f
            echo "✅ Deployed ${{ env.APP_NAME }} on port ${{ env.APP_PORT }}"
